server {
  listen 80;
  root /usr/share/nginx/html;

  # API çağrıları ve sağlık uçları API konteynerine gider (UI ile aynı origin: CORS gerekmez).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;   # AI asistanı birden çok model + araç turu yapabilir (yerel model yavaş)
  }

  location /health {
    proxy_pass http://api:8080;
  }

  # Derlenmiş JS/CSS dosyaları içerik hash'li: uzun süre önbelleğe alınabilir.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
